name: Validation Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  parseable:
    name: Parseable validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run parseable validation
        run: cargo run --release --bin aufbau -- validate -m parseable

      - name: Show generated reports (parseable)
        if: always()
        run: |
          echo "Validation reports (parseable):"
          ls -la validation/reports || true
          echo "--- latest report ---"
          ls -t validation/reports/*.txt 2>/dev/null | head -n 1 || true
          tail -n +1 validation/reports/*.txt 2>/dev/null || true

      - name: Upload parseable reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports-parseable
          path: validation/reports/*.txt

  completable:
    name: Completable validation — ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [arithmetic, stlc, imp, fun, weird]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run completable validation for ${{ matrix.module }}
        run: cargo run --release --bin aufbau -- validate -m completable --filter "${{ matrix.module }}::"

      - name: Show generated reports (module)
        if: always()
        run: |
          echo "Validation reports (module=${{ matrix.module }}):"
          ls -la validation/reports || true
          echo "--- failures (if any) ---"
          grep -Hn "FAIL" validation/reports/*.txt || true

      - name: Upload module reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports-${{ matrix.module }}
          path: validation/reports/*.txt

  verification:
    name: Coq verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up OCaml with Coq and Dune
        uses: ocaml/setup-opam@v2
        with:
          ocaml-version: '5.2.0'
          opam-pin: coq 8.18.0
        shell: bash

      - name: Build Coq verification
        run: |
          cd verification
          dune build @coq

      - name: Run verification check on prefixes
        run: |
          cd verification
          ./check_prefixes.sh prefixes/stlc.txt 3
          ./check_prefixes.sh prefixes/fun.txt 3
          ./check_prefixes.sh prefixes/imp.txt 3
          ./check_prefixes.sh prefixes/typescript.txt 3

  linecount:
    name: Line count enforcement
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check line count limits
        run: |
          declare -A LIMITS
          LIMITS["src/logic/fusion"]=1500
          LIMITS["src/logic/grammar"]=800
          LIMITS["src/logic/typing"]=700
          LIMITS["src/logic/search"]=600
          LIMITS["src/logic/binding"]=400
          LIMITS["src/cli"]=600
          LIMITS["src/validation"]=1000
          LIMITS["src/regex"]=800
          
          FAILED=0
          
          for dir in "${!LIMITS[@]}"; do
            MAX_LINES="${LIMITS[$dir]}"
            echo "Checking $dir (max $MAX_LINES lines):"
            for file in $(find "$dir" -name '*.rs' -type f 2>/dev/null); do
              lines=$(wc -l < "$file")
              if [ "$lines" -gt $MAX_LINES ]; then
                echo "  FAIL: $file has $lines lines"
                FAILED=1
              fi
            done
          done
          
          if [ $FAILED -eq 1 ]; then
            echo "Line count check FAILED"
            exit 1
          fi
          echo "All line count checks passed"