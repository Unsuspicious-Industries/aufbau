name: Publish Python Package

on:
  release:
    types: [published]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate compilation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Validate Python FFI compiles
        run: cargo check --features python-ffi --locked

  build-and-publish:
    name: Build & publish wheels
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install maturin
        run: pip install "maturin>=1.4,<2.0" twine

      - name: Build wheel (cp39)
        run: maturin build --release --features python-ffi --out dist --interpreter cp39 --manylinux auto

      - name: Build wheel (cp310)
        run: maturin build --release --features python-ffi --out dist --interpreter cp310 --manylinux auto

      - name: Build wheel (cp311)
        run: maturin build --release --features python-ffi --out dist --interpreter cp311 --manylinux auto

      - name: Build wheel (cp312)
        run: maturin build --release --features python-ffi --out dist --interpreter cp312 --manylinux auto

      - name: Build wheel (cp313)
        run: maturin build --release --features python-ffi --out dist --interpreter cp313 --manylinux auto

      - name: List wheels
        run: ls -la dist/

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.MATURIN_PYPI_TOKEN }}
        run: twine upload --skip-existing --verbose dist/*.whl
