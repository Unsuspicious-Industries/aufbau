name: Publish Python Package

on:
  release:
    types: [published]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  # Pinned, and identical on x86_64 and aarch64. The 0.2.1 aarch64 wheel shipped
  # without `Synthesizer.from_grammar`/`mask`/`status`/`root_type`/`in_scope`
  # while x86_64 was fine; none of those are cfg-gated, so the suspect is the
  # PyO3 0.29 macro expansion under a floating `stable` that resolved
  # differently per runner. Bump deliberately, together, never implicitly.
  RUST_TOOLCHAIN: "1.90.0"

jobs:
  validate:
    name: Validate compilation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Validate Python FFI compiles
        run: cargo check --features python-ffi --locked

  build:
    name: Build & upload (Python ${{ matrix.python-version }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: validate
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        arch: [x86_64]
        include:
          - python-version: "3.9"
            os: ubuntu-24.04-arm
            arch: aarch64
          - python-version: "3.10"
            os: ubuntu-24.04-arm
            arch: aarch64
          - python-version: "3.11"
            os: ubuntu-24.04-arm
            arch: aarch64
          - python-version: "3.12"
            os: ubuntu-24.04-arm
            arch: aarch64
          - python-version: "3.13"
            os: ubuntu-24.04-arm
            arch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install maturin
        run: python -m pip install "maturin>=1.4,<2.0"

      - name: Build wheel
        # Explicit interpreter: never infer the ABI from whatever `python` the
        # runner happens to expose.
        run: |
          python -m maturin build --release --features python-ffi \
            --interpreter python${{ matrix.python-version }} \
            --out dist --compatibility pypi

      - name: List wheels
        run: ls -la dist/

      # The regression that let the 0.2.1 aarch64 wheel ship without half of
      # Synthesizer: nothing ever compared the built artifact against its stub.
      # Install what we are about to publish, into a clean venv, and check it.
      - name: Smoke test built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --quiet --upgrade pip
          /tmp/smoke/bin/python -m pip install --quiet dist/*.whl
          cd /tmp  # import the installed wheel, never the source tree
          /tmp/smoke/bin/python -c "import aufbau, aufbau.dsl; print(aufbau.__file__, aufbau.ENGINE_API)"
          /tmp/smoke/bin/python "$GITHUB_WORKSPACE/scripts/check_wheel_api.py"

      - name: Upload wheel to PyPI
        run: pipx run twine upload --skip-existing --verbose dist/*.whl
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.MATURIN_PYPI_TOKEN }}
