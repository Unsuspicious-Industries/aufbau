name: Publish Python Package

on:
  release:
    types: [published]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate compilation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Validate Python FFI compiles
        run: cargo check --features python-ffi --locked

  build:
    name: Build & upload wheel (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - python-version: "3.9"
            py-short: "39"
          - python-version: "3.10"
            py-short: "310"
          - python-version: "3.11"
            py-short: "311"
          - python-version: "3.12"
            py-short: "312"
          - python-version: "3.13"
            py-short: "313"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --features python-ffi --out dist --interpreter cp${{ matrix.py-short }}
          manylinux: auto

      - name: Upload wheel to PyPI
        run: |
          pip install twine
          twine upload --skip-existing --verbose dist/*.whl
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.MATURIN_PYPI_TOKEN }}
