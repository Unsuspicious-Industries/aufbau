[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "aufbau-python"
version = "0.1.0"
description = "Python bindings for aufbau typed constrained decoding"
requires-python = ">=3.9"

[tool.maturin]
features = ["python-ffi", "pyo3/extension-module"]
module-name = "aufbau_python"
bindings = "pyo3"
