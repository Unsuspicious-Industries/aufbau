[package]
name = "aufbau"
version = "0.5.2"
edition = "2024"
authors = ["pkd <pkd@unsuspicious.org>"]
description = "Generalized prefix parsing for a class of context-dependent languages"
license = "MIT"
repository = "https://github.com/Unsuspicious-Industries/aufbau"
homepage = "https://unsuspicious.org/blog/proposition-7"
readme = "README.md"
# examples/ contains only .auf grammars, not Rust; runnable tours live in tour/.
autoexamples = false
keywords = ["llm", "constrained-decoding", "type-systems", "grammar", "parsing"]
categories = ["parsing", "text-processing", "development-tools"]
exclude = [
    "target/",
    ".venv/",
    "tmp/",
    "perf.data*",
    "test.perf",
    "flamegraph.svg",
    ".git/",
    "forbid_copying/",
    "rules/",
    # Paper draft and scratch reports: real work, but not part of the
    # published crate.
    "draft/",
    "report.*",
    "indent.log",
    "notes.md",
    "experiments/",
]

[lib]
path = "src/mod.rs"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "aufbau"
path = "src/main.rs"

# examples/ holds only .auf grammars; runnable Rust tours live in tour/.
[[example]]
name = "term_unification"
path = "tour/term_unification.rs"

[dependencies]
bimap = "0.6.3"

clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rouille = "3.6.2"
anyhow = "1.0.100"

regex-syntax = "0.8.6"

# parallelization
rayon = "1.10"

# cache
moka = { version = "0.12", features = ["sync"] }
once_cell = "1.17.1"

# progress
indicatif = "0.17"
atty = "0.2"
pyo3 = { version = "0.29", optional = true }
# no `link` feature: OCaml is the host and provides its own runtime; bundling it
# into the staticlib would multiply-define caml_* symbols at the OCaml link step.
ocaml = { version = "1.3", optional = true, default-features = false, features = ["derive"] }
[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "chart_growth"
harness = false

[features]
default = []
python-ffi = ["dep:pyo3"]
# `extension-module` splits from `python-ffi` because pyo3's extension-module
# feature suppresses the link directive for libpython — right for a wheel the
# interpreter loads, fatal for a test binary, which must link libpython itself.
#
# `abi3-py311` builds against the stable ABI, so one wheel per platform serves
# 3.11 and every later interpreter. Without it pyo3 emits a version-specific
# wheel and publishing means a build per Python minor. It pairs with
# `[tool.maturin] target-version`, which is only consulted for abi3 builds.
extension-module = ["python-ffi", "pyo3/extension-module", "pyo3/abi3-py311"]
# Record IR execution for debugging. Compiled out by default: `trace!` puts the
# whole call, arguments included, behind this cfg, so `run` is unchanged without it.
trace = []
ocaml-ffi = ["dep:ocaml"]
