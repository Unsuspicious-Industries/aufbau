[package]
name = "aufbau"
version = "0.2.0"
edition = "2024"
authors = ["pkd <pkd@unsuspicious.org>"]
description = "Generalized prefix parsing for a class of context-dependent languages"
license = "MIT"
repository = "https://github.com/Unsuspicious-Industries/aufbau"
homepage = "https://unsuspicious.org/blog/proposition-7"
readme = "README.md"
# examples/ contains only .auf grammars, not Rust; runnable tours live in tour/.
autoexamples = false
keywords = ["llm", "constrained-decoding", "type-systems", "grammar", "parsing"]
categories = ["parsing", "text-processing", "development-tools"]
exclude = [
    "target/",
    ".venv/",
    "tmp/",
    "perf.data*",
    "test.perf",
    "flamegraph.svg",
    ".git/",
    "forbid_copying/",
    "rules/",
]

[lib]
path = "src/mod.rs"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "aufbau"
path = "src/main.rs"

# examples/ holds only .auf grammars; runnable Rust tours live in tour/.
[[example]]
name = "term_unification"
path = "tour/term_unification.rs"

[dependencies]
bimap = "0.6.3"

clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rouille = "3.6.2"
anyhow = "1.0.100"

regex-syntax = "0.8.6"

# parallelization
rayon = "1.10"

# cache
moka = { version = "0.12", features = ["sync"] }
once_cell = "1.17.1"

# progress
indicatif = "0.17"
atty = "0.2"
pyo3 = { version = "0.23", optional = true }
# no `link` feature: OCaml is the host and provides its own runtime; bundling it
# into the staticlib would multiply-define caml_* symbols at the OCaml link step.
ocaml = { version = "1.3", optional = true, default-features = false, features = ["derive"] }
[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "chart_growth"
harness = false

[features]
default = []
python-ffi = ["dep:pyo3", "pyo3/extension-module"]
ocaml-ffi = ["dep:ocaml"]
